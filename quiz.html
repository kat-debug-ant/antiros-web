<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Antirōs — Kvíz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #05070d;
            color: #eeeef5;
            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .quiz {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .title {
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: normal;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }

        .description {
            color: #aaa8b5;
            line-height: 1.8;
            margin-bottom: 45px;
        }

        .question {
            padding: 40px 25px;

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;

            background: rgba(255,255,255,0.035);
            backdrop-filter: blur(12px);
        }

        .progress {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            opacity: 0.45;
            margin-bottom: 25px;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            font-weight: normal;
            line-height: 1.5;
            margin-bottom: 35px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            width: 100%;

            padding: 18px 20px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;

            background: rgba(255,255,255,0.025);

            color: #eeeef5;

            font-family: inherit;
            font-size: 1rem;

            cursor: pointer;

            transition: 0.25s;
        }

        .answer:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(180,220,255,0.35);
            transform: translateY(-2px);
        }

        .result {
            display: none;

            padding: 50px 30px;

            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 25px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(120,160,190,0.12),
                    transparent 70%
                ),
                rgba(255,255,255,0.03);
        }

        .result-label {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            opacity: 0.5;
            margin-bottom: 20px;
        }

        .result h2 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 10px;
        }

        .tribe {
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .result-description {
            color: #aaa8b5;
            line-height: 1.8;
            max-width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>

<div class="quiz">

    <div class="title">
        ANTIRŌS
    </div>

    <h1>
        Najdi svůj biom
    </h1>

    <p class="description">
        Odpovědi nejsou správné ani špatné.
        Každá z nich odhaluje něco o tom,
        jak vnímáš svět.
    </p>

    <div class="question" id="questionBox">

        <div class="progress" id="progress">
            OTÁZKA 1
        </div>

        <h2 id="question">
            Když se ocitneš v úplně neznámém prostředí,
            co uděláš jako první?
        </h2>

        <div class="answers" id="answers">

            <button class="answer">
                Pozoruji okolí a snažím se pochopit, co se děje.
            </button>

            <button class="answer">
                Hledám někoho, s kým můžu situaci řešit společně.
            </button>

            <button class="answer">
                Prostě vyrazím vpřed a zjistím to cestou.
            </button>

            <button class="answer">
                Nejdřív si vytvořím plán a promyslím možné scénáře.
            </button>

        </div>

    </div>


    <div class="result" id="resultBox">

        <div class="result-label">
            TVŮJ VÝSLEDEK
        </div>

        <h2 id="resultBiome">
            Şivrűa
        </h2>

        <div class="tribe" id="resultTribe">
            Nhaurë
        </div>

        <p class="result-description" id="resultDescription">
            Výsledek kvízu se zobrazí zde.
        </p>

    </div>

</div>


<script>

    const answers = document.querySelectorAll(".answer");

    answers.forEach(answer => {

        answer.addEventListener("click", () => {

            document.getElementById("questionBox").style.display = "none";

            document.getElementById("resultBox").style.display = "block";

        });

    });

</script>

</body>
</html>
